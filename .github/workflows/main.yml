name: Flutter Build and Release

on:
  push:
    tags:
      - "v*"
    # Every branch push is compiled and tested; only tags create a release.
    branches:
      - "**"
  # Lets you build an APK from any branch via "Run workflow" (no release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      # The launcher activity must be inside the APK, otherwise the app
      # crashes on startup (ClassNotFoundException for MainActivity).
      - name: Verify launcher activity is packaged
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if ! unzip -p "$APK" 'classes*.dex' | grep -a -q 'Ldev/voloder/dlwms/MainActivity;'; then
            echo "::error::dev.voloder.dlwms.MainActivity is missing from the APK. Is android/app/src/main/kotlin/dev/voloder/dlwms/MainActivity.kt committed?"
            exit 1
          fi
          echo "MainActivity found in APK."

      - name: Rename APK
        run: |
          APP_NAME=$(basename "$GITHUB_REPOSITORY")
          VERSION=${GITHUB_REF_NAME//\//-}
          APK_NAME="${APP_NAME}-${VERSION}.apk"

          mv build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ env.APK_NAME }}
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Screenshots

# Renders every screen with sample data (light + dark) and publishes the PNGs
# to the `screenshots` branch. Run it from Actions → Screenshots → Run
# workflow; it also runs on pushes to design/** branches.
on:
  workflow_dispatch:
  push:
    branches:
      - "design/**"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Render screenshots
        run: flutter test --update-goldens screenshots/

      - name: Publish to the screenshots branch
        run: |
          SRC="$GITHUB_WORKSPACE/screenshots/goldens"
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT"
          cp "$SRC"/*.png "$OUT"/
          cd "$OUT"
          git init -q
          git checkout -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots for ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
